services:
  bot:
    platform: linux/arm64
    environment:
      STT_LOCAL_REFINEMENT_ENABLED: ${STT_LOCAL_REFINEMENT_ENABLED:-true}
    security_opt:
      - seccomp=${BOT_SECCOMP_PROFILE:?BOT_SECCOMP_PROFILE must point to the Docker 28.5.2 ARM64 seccomp profile}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
