<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="bilingual-stt-refinement-title bilingual-stt-refinement-desc" font-family="'Geist', 'Noto Sans JP', sans-serif">
  <title id="bilingual-stt-refinement-title">日本語と韓国語の補助音声認識</title>
  <desc id="bilingual-stt-refinement-desc">通常のSonioxには本人の音声を送り続ける。韓国語話者にはPiで認識した先頭2.4秒のヒントから最後の不確かな語を除いて加える。日本語話者には直前の相手の短い音声を補助側で先に聞かせ、先行音声の確定後に本人の全音声を送る。同じ一つの発話で期限内の結果だけ、原文と訳を一緒に採用する。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
  </defs>
  <rect width="1280" height="720" fill="#f5f5f5"/>
  <text x="48" y="48" fill="#4f5d75" font-size="14">日本語・韓国語 / Raspberry Pi 4</text>
  <text x="48" y="100" fill="#2d3142" font-size="36" font-weight="600">日韓で判断材料を変え、本人の全音声を再認識する</text>

  <path d="M256 304 H304 Q312 304 312 296 V224 Q312 216 320 216 H432" fill="none" stroke="#2e5aa8" stroke-width="2" marker-end="url(#arrow-link)"/>
  <path d="M152 384 V444 Q152 452 160 452 H376" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M256 344 H912 Q920 344 920 352 V400" fill="none" stroke="#2e5aa8" stroke-width="2" marker-end="url(#arrow-link)"/>
  <line x1="664" y1="216" x2="808" y2="216" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="736" y1="452" x2="808" y2="452" stroke="#2e5aa8" stroke-width="2" marker-end="url(#arrow-link)"/>
  <line x1="1000" y1="400" x2="1000" y2="268" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1040" y1="216" x2="1088" y2="216" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/>

  <g fill="#f5f5f5"><rect x="328" y="184" width="88" height="24"/><rect x="680" y="184" width="112" height="24"/><rect x="648" y="312" width="208" height="24"/><rect x="208" y="420" width="152" height="24"/><rect x="744" y="420" width="56" height="24"/><rect x="1012" y="316" width="96" height="24"/></g>
  <g fill="#4f5d75" font-size="14" text-anchor="middle">
    <text x="372" y="202">即時送信</text><text x="736" y="202">通常の結果</text>
    <text x="752" y="330">同じ発話の全音声</text><text x="284" y="438">音声から準備</text>
    <text x="772" y="438" font-size="12">補助情報</text><text x="1060" y="334">補助結果</text>
  </g>

  <g data-node="source">
    <rect x="48" y="264" width="208" height="120" rx="8" fill="#e8eaf0" stroke="#7a8399"/>
    <text x="152" y="310" fill="#2d3142" font-size="18" font-weight="600" text-anchor="middle">Discordの音声</text>
    <text x="152" y="342" fill="#4f5d75" font-size="14" text-anchor="middle">許可された話者ごと</text>
  </g>
  <g data-node="primary">
    <rect x="432" y="164" width="232" height="104" rx="8" fill="#edeef0" stroke="#9c9da5"/>
    <text x="548" y="205" fill="#2d3142" font-size="18" font-weight="600" text-anchor="middle">通常のSoniox</text>
    <text x="548" y="236" fill="#4f5d75" font-size="14" text-anchor="middle">認識・翻訳を継続する</text>
  </g>
  <g data-node="preparation">
    <rect x="376" y="400" width="360" height="120" rx="8" fill="#fce9e0" stroke="#eb6c36" stroke-width="2"/>
    <text x="556" y="435" fill="#2d3142" font-size="18" font-weight="600" text-anchor="middle">補助に使う情報を準備する</text>
    <text x="556" y="465" fill="#4f5d75" font-size="14" text-anchor="middle">韓国語：Dolphinの先頭2.4秒 − 末尾語</text>
    <text x="556" y="495" fill="#4f5d75" font-size="14" text-anchor="middle">日本語：直前の相手の短い音声</text>
  </g>
  <g data-node="secondary">
    <rect x="808" y="400" width="232" height="120" rx="8" fill="#edeef0" stroke="#9c9da5"/>
    <text x="924" y="442" fill="#2d3142" font-size="18" font-weight="600" text-anchor="middle">Sonioxで再認識</text>
    <text x="924" y="475" fill="#4f5d75" font-size="14" text-anchor="middle">判断材料＋本人の全音声</text>
    <text x="924" y="500" fill="#4f5d75" font-size="13" text-anchor="middle">先行音声の文字は採用しない</text>
  </g>
  <g data-node="choice">
    <rect x="808" y="164" width="232" height="104" rx="8" fill="#fce9e0" stroke="#eb6c36" stroke-width="2"/>
    <text x="924" y="205" fill="#2d3142" font-size="18" font-weight="600" text-anchor="middle">結果を採用する</text>
    <text x="924" y="236" fill="#4f5d75" font-size="14" text-anchor="middle">同じ一つの発話・期限内</text>
  </g>
  <g data-node="output">
    <rect x="1088" y="164" width="144" height="104" rx="8" fill="#ffffff" stroke="#2d3142"/>
    <text x="1160" y="205" fill="#2d3142" font-size="18" font-weight="600" text-anchor="middle">原文と訳</text>
    <text x="1160" y="236" fill="#4f5d75" font-size="14" text-anchor="middle">字幕・読み上げ</text>
  </g>
  <line x1="48" y1="564" x2="1232" y2="564" stroke="#bfc0c0"/>
  <g fill="#2d3142" font-size="16">
    <text x="48" y="604">補助結果を待つ上限は、最後の音声から2.39秒。超過時や次の発話が届いた場合は通常の結果を返す。</text>
    <text x="48" y="638">8秒以内・同時1件。過去の音声は2.4秒未満・15秒以内・同じ通話の別話者に限定する。</text>
  </g>
  <text x="48" y="680" fill="#4f5d75" font-size="14">音声はRAM内だけに保持し、退出・停止時に破棄する。改善した例と未解消の誤認識は比較表を参照。</text>
</svg>
