<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>翻訳セッションの状態遷移</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --color-accent: #eb6c36;
      --font-sans: 'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif JP', serif;
      --font-mono: 'Geist Mono', 'Noto Sans Mono CJK JP', monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { width: 100%; max-width: 960px; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 760px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">State Machine · Diagram Design</p>
    <h1>翻訳セッションの状態遷移</h1>

    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="session-state-title session-state-desc">
      <title id="session-state-title">翻訳セッションの状態遷移</title>
      <desc id="session-state-desc">待機中から認可、接続、翻訳中、停止処理へ進み、拒否や外部接続エラーから安全に待機中へ戻る状態遷移を示す。</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Transitions -->
      <line x1="48" y1="180" x2="72" y2="180" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="208" y1="180" x2="248" y2="180" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="400" y1="180" x2="440" y2="180" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="592" y1="180" x2="632" y2="180" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <path d="M 324 140 V 112 Q 324 104 316 104 H 148 Q 140 104 140 112 V 140" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <line x1="516" y1="220" x2="516" y2="360" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="708" y1="220" x2="708" y2="360" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="592" y1="400" x2="632" y2="400" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 708 440 V 472 Q 708 480 700 480 H 60 Q 52 480 52 472 V 260 Q 52 252 60 252 H 132 Q 140 252 140 244 V 220" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Transition labels -->
      <rect x="52" y="152" width="20" height="12" rx="2" fill="#f5f5f5"/>
      <text x="62" y="160" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BOOT</text>

      <rect x="208" y="152" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="228" y="160" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">START</text>

      <rect x="404" y="152" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="420" y="160" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ALLOW</text>

      <rect x="596" y="152" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="612" y="160" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">READY</text>

      <rect x="208" y="80" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="232" y="88" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DENY</text>

      <rect x="528" y="280" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="572" y="288" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SETUP ERROR</text>

      <rect x="720" y="280" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="772" y="288" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">END CONDITION</text>

      <rect x="592" y="372" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="612" y="380" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CLEAN</text>

      <rect x="392" y="452" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="424" y="460" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CLOSED</text>

      <!-- Start marker -->
      <circle cx="40" cy="180" r="6" fill="#2d3142"/>

      <!-- States -->
      <rect x="72" y="140" width="136" height="80" rx="8" fill="#f5f5f5"/>
      <rect x="72" y="140" width="136" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="80" y="148" width="48" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="104" y="156" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="140" y="184" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans JP', sans-serif" text-anchor="middle">待機中</text>
      <text x="140" y="204" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">IDLE</text>

      <rect x="248" y="140" width="152" height="80" rx="8" fill="#f5f5f5"/>
      <rect x="248" y="140" width="152" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="256" y="148" width="48" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="280" y="156" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="324" y="184" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans JP', sans-serif" text-anchor="middle">認可確認</text>
      <text x="324" y="204" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">AUTHORIZING</text>

      <rect x="440" y="140" width="152" height="80" rx="8" fill="#f5f5f5"/>
      <rect x="440" y="140" width="152" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="448" y="148" width="48" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="472" y="156" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="516" y="184" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans JP', sans-serif" text-anchor="middle">外部接続中</text>
      <text x="516" y="204" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">CONNECTING</text>

      <rect x="632" y="140" width="152" height="80" rx="8" fill="#f5f5f5"/>
      <rect x="632" y="140" width="152" height="80" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="640" y="148" width="48" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.52)" stroke-width="0.8"/>
      <text x="664" y="156" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="708" y="184" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans JP', sans-serif" text-anchor="middle">翻訳中</text>
      <text x="708" y="204" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">ACTIVE</text>

      <rect x="440" y="360" width="152" height="80" rx="8" fill="#f5f5f5"/>
      <rect x="440" y="360" width="152" height="80" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="448" y="368" width="48" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.48)" stroke-width="0.8"/>
      <text x="472" y="376" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="516" y="404" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans JP', sans-serif" text-anchor="middle">障害</text>
      <text x="516" y="424" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">FAILED</text>

      <rect x="632" y="360" width="152" height="80" rx="8" fill="#f5f5f5"/>
      <rect x="632" y="360" width="152" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="640" y="368" width="48" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="664" y="376" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="708" y="404" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans JP', sans-serif" text-anchor="middle">停止処理中</text>
      <text x="708" y="424" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">STOPPING</text>

      <!-- State-wide fatal error note -->
      <rect x="80" y="300" width="288" height="44" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
      <text x="96" y="320" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">ACTIVE → FAILED</text>
      <text x="96" y="336" fill="#4f5d75" font-size="8" font-family="'Geist', 'Noto Sans JP', sans-serif">復旧不能なDiscordまたはSonioxエラー</text>

      <!-- Legend strip -->
      <line x1="40" y1="536" x2="920" y2="536" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="560" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="144" y="548" width="20" height="12" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>
      <text x="176" y="560" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Normal state</text>
      <rect x="304" y="548" width="20" height="12" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="0.8"/>
      <text x="336" y="560" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Billable active state</text>
      <line x1="520" y1="554" x2="568" y2="554" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="584" y="560" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Rejected path</text>
    </svg>
  </div>
</body>
</html>
