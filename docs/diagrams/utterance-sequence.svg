<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 840" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="utterance-sequence-title utterance-sequence-desc">
      <title id="utterance-sequence-title">1発話を翻訳音声と字幕へ変換する流れ</title>
      <desc id="utterance-sequence-desc">Discordから発話開始の通知を受けると、TTSのWebSocket接続を先に開始し、発話者の音声を受信してSTTへ送る。未確定の認識結果は最大500ミリ秒間隔でDiscordの仮字幕へ反映する。発話を確定した後は、確定字幕の送信と読み上げ音声の生成を並行して始める。</desc>
      <defs>
        <style>@import url("https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Lifelines -->
      <line x1="120" y1="128" x2="120" y2="760" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="360" y1="128" x2="360" y2="760" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="620" y1="128" x2="620" y2="760" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="880" y1="128" x2="880" y2="760" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="1140" y1="128" x2="1140" y2="760" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- Activation bars stay behind arrows and labels -->
      <rect x="356" y="168" width="8" height="552" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="1136" y="400" width="8" height="304" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- Messages: 12 arrows, within the sequence budget -->
      <line x1="120" y1="176" x2="356" y2="176" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="364" y1="216" x2="880" y2="216" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="120" y1="264" x2="356" y2="264" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="364" y1="312" x2="620" y2="312" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="620" y1="360" x2="364" y2="360" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <line x1="364" y1="408" x2="1136" y2="408" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <line x1="620" y1="456" x2="364" y2="456" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="364" y1="504" x2="1136" y2="504" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <line x1="364" y1="552" x2="880" y2="552" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="880" y1="600" x2="364" y2="600" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <line x1="364" y1="648" x2="1136" y2="648" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="1136" y1="696" x2="124" y2="696" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>

      <!-- The STT boundary is both the utterance and TTS-content gate -->
      <rect x="704" y="436" width="160" height="20" rx="4" fill="rgba(235,108,54,0.08)" stroke="rgba(235,108,54,0.45)" stroke-width="1"/>
      <text x="784" y="448" fill="#2d3142" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace" text-anchor="middle">発話を確定してから読み上げ文を送る</text>

      <!-- Message labels: each mask keeps an 8px gap from its connector -->
      <rect x="216" y="156" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="240" y="164" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace" text-anchor="middle">発話開始</text>

      <rect x="580" y="196" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="620" y="204" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace" text-anchor="middle">TTS接続を先に開始</text>

      <rect x="208" y="244" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="240" y="252" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace" text-anchor="middle">Opus音声を受信</text>

      <rect x="448" y="292" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="488" y="300" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace" text-anchor="middle">PCM音声を送信</text>

      <rect x="452" y="340" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="492" y="348" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace" text-anchor="middle">認識・翻訳結果</text>

      <rect x="720" y="388" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="752" y="396" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace" text-anchor="middle">仮字幕を更新</text>

      <rect x="464" y="436" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="492" y="444" fill="#eb6c36" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace" text-anchor="middle">発話を確定</text>

      <rect x="712" y="484" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="752" y="492" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace" text-anchor="middle">確定字幕を送信</text>

      <rect x="568" y="532" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="620" y="540" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace" text-anchor="middle">読み上げ文の送信を完了</text>

      <rect x="588" y="580" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="620" y="588" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace" text-anchor="middle">読み上げ音声</text>

      <rect x="724" y="628" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="752" y="636" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace" text-anchor="middle">音声を再生</text>

      <rect x="592" y="676" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="632" y="684" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace" text-anchor="middle">翻訳音声を出力</text>

      <!-- Actors -->
      <rect x="40" y="64" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="64" width="160" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="120" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans JP', sans-serif" text-anchor="middle">発話者</text>
      <text x="120" y="112" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace" text-anchor="middle">Discord音声チャンネル</text>

      <rect x="280" y="64" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="280" y="64" width="160" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="360" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans JP', sans-serif" text-anchor="middle">Botの音声翻訳処理</text>
      <text x="360" y="112" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace" text-anchor="middle">発話を確定してから順番に処理</text>

      <rect x="540" y="64" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="540" y="64" width="160" height="64" rx="6" fill="rgba(46,90,168,0.04)" stroke="#2e5aa8" stroke-width="1"/>
      <text x="620" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans JP', sans-serif" text-anchor="middle">Soniox STT</text>
      <text x="620" y="112" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace" text-anchor="middle">音声認識と双方向翻訳</text>

      <rect x="800" y="64" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="800" y="64" width="160" height="64" rx="6" fill="rgba(46,90,168,0.04)" stroke="#2e5aa8" stroke-width="1"/>
      <text x="880" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans JP', sans-serif" text-anchor="middle">Soniox TTS</text>
      <text x="880" y="112" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace" text-anchor="middle">常時接続のWebSocket</text>

      <rect x="1060" y="64" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="1060" y="64" width="160" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="1140" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans JP', sans-serif" text-anchor="middle">Discord出力</text>
      <text x="1140" y="112" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace" text-anchor="middle">翻訳音声と字幕</text>

      <!-- Legend strip -->
      <line x1="40" y1="780" x2="1240" y2="780" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="808" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace">凡例</text>
      <line x1="148" y1="802" x2="196" y2="802" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="212" y="808" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace">呼び出し</text>
      <line x1="300" y1="802" x2="348" y2="802" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="364" y="808" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace">応答</text>
      <line x1="468" y1="802" x2="516" y2="802" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <text x="532" y="808" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace">非同期の出力</text>
      <line x1="680" y1="802" x2="728" y2="802" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="744" y="808" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace">発話の確定</text>
    </svg>
