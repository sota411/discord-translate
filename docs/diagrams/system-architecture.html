<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discordリアルタイム翻訳Botのシステム構成</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --color-accent: #eb6c36;
      --font-sans: 'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif JP', serif;
      --font-mono: 'Geist Mono', 'Noto Sans Mono CJK JP', monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { width: 100%; max-width: 1280px; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>Discordリアルタイム翻訳Botのシステム構成</h1>

    <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="system-architecture-title system-architecture-desc">
      <title id="system-architecture-title">Discordリアルタイム翻訳Botのシステム構成</title>
      <desc id="system-architecture-desc">Discordの音声とコマンドをBotが受け、Sonioxの音声認識・双方向翻訳・読み上げを経て、翻訳音声と字幕をDiscordへ返す構成を示す。</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Trust and runtime zones -->
      <rect x="40" y="64" width="320" height="540" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="52" y="68" width="96" height="16" rx="2" fill="#f5f5f5"/>
      <text x="100" y="80" fill="rgba(45,49,66,0.48)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DISCORD</text>

      <rect x="400" y="64" width="500" height="540" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="412" y="68" width="112" height="16" rx="2" fill="#f5f5f5"/>
      <text x="468" y="80" fill="rgba(45,49,66,0.48)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">BOT BACKEND</text>

      <rect x="920" y="64" width="320" height="540" rx="8" fill="rgba(46,90,168,0.03)" stroke="rgba(46,90,168,0.18)" stroke-width="0.8"/>
      <rect x="932" y="68" width="104" height="16" rx="2" fill="#f5f5f5"/>
      <text x="984" y="80" fill="rgba(46,90,168,0.70)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SONIOX API</text>

      <!-- Connectors: drawn before nodes -->
      <path d="M 320 320 H 368 Q 376 320 376 312 V 168 Q 376 160 384 160 H 440" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="320" y1="348" x2="520" y2="348" stroke="#2e5aa8" stroke-width="1.2" marker-start="url(#arrow-link)" marker-end="url(#arrow-link)"/>
      <line x1="640" y1="160" x2="680" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 760 200 V 244 Q 760 252 752 252 H 728 Q 720 252 720 260 V 300" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 500 200 V 512 Q 500 520 508 520 H 600" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <path d="M 800 324 H 872 Q 880 324 880 316 V 312 Q 880 304 888 304 H 960" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-start="url(#arrow-link)" marker-end="url(#arrow-link)"/>
      <path d="M 800 372 H 872 Q 880 372 880 380 V 452 Q 880 460 888 460 H 960" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-start="url(#arrow-link)" marker-end="url(#arrow-link)"/>
      <path d="M 520 372 H 408 Q 400 372 400 380 V 492 Q 400 500 392 500 H 320" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <line x1="660" y1="396" x2="660" y2="480" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- Connector labels with paper masks -->
      <rect x="388" y="228" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="414" y="236" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SLASH</text>

      <rect x="368" y="320" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="420" y="328" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OPUS / PCM</text>

      <rect x="644" y="132" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="660" y="140" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ALLOW</text>

      <rect x="724" y="224" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="740" y="232" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">START</text>

      <rect x="508" y="488" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="532" y="496" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">QUOTA</text>

      <rect x="820" y="288" width="92" height="12" rx="2" fill="#f5f5f5"/>
      <text x="866" y="296" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PCM / TOKENS</text>

      <rect x="892" y="408" width="68" height="12" rx="2" fill="#f5f5f5"/>
      <text x="926" y="416" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TEXT / PCM</text>

      <rect x="408" y="428" width="68" height="12" rx="2" fill="#f5f5f5"/>
      <text x="442" y="436" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CAPTION</text>

      <rect x="672" y="432" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="694" y="440" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">METER</text>

      <!-- Discord nodes -->
      <rect x="80" y="300" width="240" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="80" y="300" width="240" height="96" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="88" y="308" width="64" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.48)" stroke-width="0.8"/>
      <text x="120" y="316" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DISCORD</text>
      <text x="200" y="348" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans JP', sans-serif" text-anchor="middle">利用者と音声チャンネル</text>
      <text x="200" y="368" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">slash command · Opus audio</text>

      <rect x="80" y="460" width="240" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="80" y="460" width="240" height="80" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="88" y="468" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.36)" stroke-width="0.8"/>
      <text x="108" y="476" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TEXT</text>
      <text x="200" y="504" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans JP', sans-serif" text-anchor="middle">字幕チャンネル</text>
      <text x="200" y="524" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">final transcript + translation</text>

      <!-- Bot nodes -->
      <rect x="440" y="120" width="200" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="440" y="120" width="200" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="448" y="128" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="476" y="136" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POLICY</text>
      <text x="540" y="164" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans JP', sans-serif" text-anchor="middle">コマンドと利用制御</text>
      <text x="540" y="184" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">allowlist · quota · permissions</text>

      <rect x="680" y="120" width="200" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="680" y="120" width="200" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="688" y="128" width="64" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="720" y="136" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SESSION</text>
      <text x="780" y="164" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans JP', sans-serif" text-anchor="middle">セッション管理</text>
      <text x="780" y="184" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">one active session / guild</text>

      <rect x="520" y="300" width="280" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="520" y="300" width="280" height="96" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="528" y="308" width="72" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.52)" stroke-width="0.8"/>
      <text x="564" y="316" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PIPELINE</text>
      <text x="660" y="348" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans JP', sans-serif" text-anchor="middle">音声翻訳パイプライン</text>
      <text x="660" y="368" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">receive · stabilize · queue · play</text>

      <rect x="600" y="480" width="200" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="600" y="480" width="200" height="80" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="608" y="488" width="48" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.48)" stroke-width="0.8"/>
      <text x="632" y="496" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
      <text x="700" y="524" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans JP', sans-serif" text-anchor="middle">利用量台帳</text>
      <text x="700" y="544" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">SQLite · no transcript</text>

      <!-- Soniox nodes -->
      <rect x="960" y="260" width="240" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="960" y="260" width="240" height="88" rx="6" fill="rgba(46,90,168,0.04)" stroke="#2e5aa8" stroke-width="1"/>
      <rect x="968" y="268" width="56" height="12" rx="2" fill="transparent" stroke="rgba(46,90,168,0.48)" stroke-width="0.8"/>
      <text x="996" y="276" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SONIOX</text>
      <text x="1080" y="308" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans JP', sans-serif" text-anchor="middle">音声認識と双方向翻訳</text>
      <text x="1080" y="328" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">stt-rt-v5 · WebSocket</text>

      <rect x="960" y="416" width="240" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="960" y="416" width="240" height="88" rx="6" fill="rgba(46,90,168,0.04)" stroke="#2e5aa8" stroke-width="1"/>
      <rect x="968" y="424" width="56" height="12" rx="2" fill="transparent" stroke="rgba(46,90,168,0.48)" stroke-width="0.8"/>
      <text x="996" y="432" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SONIOX</text>
      <text x="1080" y="464" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans JP', sans-serif" text-anchor="middle">ストリーミング読み上げ</text>
      <text x="1080" y="484" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">tts-rt-v2 · WebSocket</text>

      <!-- Legend strip -->
      <line x1="40" y1="644" x2="1240" y2="644" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="668" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="144" y="656" width="20" height="12" rx="4" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="0.8"/>
      <text x="176" y="668" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Discord boundary</text>
      <rect x="332" y="656" width="20" height="12" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>
      <text x="364" y="668" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Bot service</text>
      <rect x="500" y="656" width="20" height="12" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="532" y="668" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Persistent usage only</text>
      <line x1="748" y1="662" x2="796" y2="662" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="812" y="668" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Streaming API</text>
      <line x1="972" y1="662" x2="1020" y2="662" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="1036" y="668" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Async / metering</text>

  </div>
</body>
</html>
