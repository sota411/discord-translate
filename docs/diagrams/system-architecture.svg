<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="system-architecture-title system-architecture-desc">
      <title id="system-architecture-title">Discordリアルタイム翻訳Botのシステム構成</title>
      <desc id="system-architecture-desc">Discordの音声とコマンドをBotが受ける。BotはSonioxで音声認識と双方向翻訳を行い、意味の区切りを検出したとき、または手動で発話を確定したときに翻訳文を読み上げへ送る。翻訳音声は音声チャンネルへ、字幕は専用の公開スレッドへ返す。セッションカードは親テキストチャンネルへ投稿する。</desc>
      <defs>
        <style>@import url("https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Trust and runtime zones -->
      <rect x="40" y="64" width="320" height="540" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="52" y="68" width="96" height="16" rx="2" fill="#f5f5f5"/>
      <text x="100" y="80" fill="rgba(45,49,66,0.48)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DISCORD</text>

      <rect x="400" y="64" width="500" height="540" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="412" y="68" width="112" height="16" rx="2" fill="#f5f5f5"/>
      <text x="468" y="80" fill="rgba(45,49,66,0.48)" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace" text-anchor="middle">Botの内部処理</text>

      <rect x="920" y="64" width="320" height="540" rx="8" fill="rgba(46,90,168,0.03)" stroke="rgba(46,90,168,0.18)" stroke-width="0.8"/>
      <rect x="932" y="68" width="104" height="16" rx="2" fill="#f5f5f5"/>
      <text x="984" y="80" fill="rgba(46,90,168,0.70)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SONIOX API</text>

      <!-- Connectors: drawn before nodes -->
      <path d="M 320 320 H 368 Q 376 320 376 312 V 168 Q 376 160 384 160 H 424" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="320" y1="348" x2="520" y2="348" stroke="#2e5aa8" stroke-width="1.2" marker-start="url(#arrow-link)" marker-end="url(#arrow-link)"/>
      <line x1="624" y1="160" x2="680" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 760 200 V 244 Q 760 252 752 252 H 728 Q 720 252 720 260 V 300" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 500 200 V 340 A 8 8 0 0 0 500 356 V 512 Q 500 520 508 520 H 600" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <line x1="800" y1="324" x2="976" y2="324" stroke="#2e5aa8" stroke-width="1.2" marker-start="url(#arrow-link)" marker-end="url(#arrow-link)"/>
      <path d="M 800 372 H 872 Q 880 372 880 380 V 452 Q 880 460 888 460 H 976" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-start="url(#arrow-link)" marker-end="url(#arrow-link)"/>
      <path d="M 520 372 H 408 Q 400 372 400 380 V 492 Q 400 500 392 500 H 320" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <line x1="660" y1="396" x2="660" y2="480" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- Connector labels with paper masks -->
      <rect x="384" y="228" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="428" y="236" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace" text-anchor="middle">スラッシュコマンド</text>

      <rect x="332" y="328" width="176" height="12" rx="2" fill="#f5f5f5"/>
      <text x="420" y="336" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace" text-anchor="middle">Opus音声を受信し、PCM音声を再生</text>

      <rect x="628" y="140" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="652" y="148" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace" text-anchor="middle">利用を許可</text>

      <rect x="688" y="224" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="720" y="232" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace" text-anchor="middle">セッションを開始</text>

      <rect x="512" y="500" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="548" y="508" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace" text-anchor="middle">利用上限を確認</text>

      <rect x="828" y="304" width="120" height="12" rx="2" fill="#f5f5f5"/>
      <text x="888" y="312" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace" text-anchor="middle">音声を送り、認識結果を受信</text>

      <rect x="888" y="408" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="932" y="416" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace" text-anchor="middle">文を送り、音声を受信</text>

      <rect x="408" y="428" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="448" y="436" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace" text-anchor="middle">カードと字幕を投稿</text>

      <rect x="668" y="432" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="696" y="440" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace" text-anchor="middle">利用量を記録</text>

      <!-- Discord nodes -->
      <rect x="80" y="300" width="240" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="80" y="300" width="240" height="96" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="88" y="308" width="64" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.48)" stroke-width="0.8"/>
      <text x="120" y="316" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DISCORD</text>
      <text x="200" y="348" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans JP', sans-serif" text-anchor="middle">利用者と音声チャンネル</text>
      <text x="200" y="368" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace" text-anchor="middle">スラッシュコマンドとステレオOpus音声</text>

      <rect x="80" y="460" width="240" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="80" y="460" width="240" height="80" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="88" y="468" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.36)" stroke-width="0.8"/>
      <text x="116" y="476" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace" text-anchor="middle">スレッド</text>
      <text x="200" y="504" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', 'Noto Sans JP', sans-serif" text-anchor="middle">親チャンネルのカード＋公開スレッド</text>
      <text x="200" y="524" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace" text-anchor="middle">カードで操作し、スレッドへ字幕を投稿</text>

      <!-- Bot nodes -->
      <rect x="424" y="120" width="200" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="424" y="120" width="200" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="432" y="128" width="48" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="456" y="136" fill="#2d3142" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace" text-anchor="middle">認可</text>
      <text x="524" y="164" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans JP', sans-serif" text-anchor="middle">コマンドを認可する</text>
      <text x="524" y="184" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace" text-anchor="middle">許可リスト、権限、利用上限を確認</text>

      <rect x="680" y="120" width="200" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="680" y="120" width="200" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="688" y="128" width="64" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="720" y="136" fill="#2d3142" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace" text-anchor="middle">セッション</text>
      <text x="780" y="164" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans JP', sans-serif" text-anchor="middle">セッション管理</text>
      <text x="780" y="184" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace" text-anchor="middle">1サーバーにつき同時に1セッション</text>

      <rect x="520" y="300" width="280" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="520" y="300" width="280" height="96" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="528" y="308" width="72" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.52)" stroke-width="0.8"/>
      <text x="564" y="316" fill="#eb6c36" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace" text-anchor="middle">音声処理</text>
      <text x="660" y="348" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans JP', sans-serif" text-anchor="middle">発話の翻訳と読み上げ</text>
      <text x="660" y="368" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace" text-anchor="middle">確定した発話を順番に処理</text>

      <rect x="600" y="480" width="200" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="600" y="480" width="200" height="80" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="608" y="488" width="48" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.48)" stroke-width="0.8"/>
      <text x="632" y="496" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace" text-anchor="middle">保存</text>
      <text x="700" y="524" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans JP', sans-serif" text-anchor="middle">利用量台帳</text>
      <text x="700" y="544" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace" text-anchor="middle">SQLite・会話本文は保存しない</text>

      <!-- Soniox nodes -->
      <rect x="976" y="260" width="240" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="976" y="260" width="240" height="88" rx="6" fill="rgba(46,90,168,0.04)" stroke="#2e5aa8" stroke-width="1"/>
      <rect x="984" y="268" width="56" height="12" rx="2" fill="transparent" stroke="rgba(46,90,168,0.48)" stroke-width="0.8"/>
      <text x="1012" y="276" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SONIOX</text>
      <text x="1096" y="308" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans JP', sans-serif" text-anchor="middle">音声認識と双方向翻訳</text>
      <text x="1096" y="328" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace" text-anchor="middle">stt-rt-v5・発話を自動または手動で確定</text>

      <rect x="976" y="416" width="240" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="976" y="416" width="240" height="88" rx="6" fill="rgba(46,90,168,0.04)" stroke="#2e5aa8" stroke-width="1"/>
      <rect x="984" y="424" width="56" height="12" rx="2" fill="transparent" stroke="rgba(46,90,168,0.48)" stroke-width="0.8"/>
      <text x="1012" y="432" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SONIOX</text>
      <text x="1096" y="464" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans JP', sans-serif" text-anchor="middle">翻訳文の読み上げ</text>
      <text x="1096" y="484" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace" text-anchor="middle">tts-rt-v2・常時接続のWebSocket</text>

      <!-- Legend strip -->
      <line x1="40" y1="644" x2="1240" y2="644" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="668" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace">凡例</text>
      <rect x="144" y="656" width="20" height="12" rx="4" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="0.8"/>
      <text x="176" y="668" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace">Discordとの境界</text>
      <rect x="332" y="656" width="20" height="12" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>
      <text x="364" y="668" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace">Botの内部処理</text>
      <rect x="500" y="656" width="20" height="12" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="532" y="668" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace">利用量だけを保存</text>
      <line x1="748" y1="662" x2="796" y2="662" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="812" y="668" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace">Sonioxとの通信</text>
      <line x1="972" y1="662" x2="1020" y2="662" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="1036" y="668" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace">非同期処理と利用量の記録</text>
    </svg>
