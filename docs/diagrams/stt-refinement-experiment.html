<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>補助音声認識の高速化を検証する流れ</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; background: #f5f5f5; color: #2d3142; font-family: 'Geist', 'Noto Sans JP', sans-serif; }
    main { max-width: 1280px; margin: auto; }
    svg { display: block; width: 100%; height: auto; }
    p { margin: 8px 24px 0; font-size: 14px; line-height: 1.7; color: #4f5d75; }
    a { color: #2e5aa8; }
  </style>
</head>
<body>
<main>
  <!-- Existing repository palette; 1280×720 presentation-size architecture figure. -->
  <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="stt-refinement-experiment-title stt-refinement-experiment-desc" font-family="'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif">
    <title id="stt-refinement-experiment-title">補助音声認識の高速化を検証する流れ</title>
    <desc id="stt-refinement-experiment-desc">Pi上のMoonshineが作った自動文字起こしと元の音声をSonioxへ送り、再認識と翻訳を行う検証用の経路で、音声の特徴計算の集約、重みの前処理の再利用、CPUの待機処理の抑制により処理を高速化したが本番には未導入である。</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
    </defs>
    <rect width="1280" height="720" fill="#f5f5f5"/>
    <text x="48" y="48" font-size="12" fill="#4f5d75">検証用の経路 / 本番未導入</text>
    <text x="48" y="100" font-family="'Instrument Serif', 'Noto Sans JP', serif" font-size="40" fill="#2d3142">Piで聞き直し、Sonioxの判断材料にする</text>

    <!-- Distinct ports and clear corridors; all connectors precede nodes. -->
    <path d="M168 328 V208 Q168 200 176 200 H400" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M720 200 H1032 Q1040 200 1040 208 V312" fill="none" stroke="#2e5aa8" stroke-width="2" marker-end="url(#arrow-link)"/>
    <line x1="288" y1="384" x2="880" y2="384" stroke="#2e5aa8" stroke-width="2" marker-end="url(#arrow-link)"/>
    <line x1="1040" y1="440" x2="1040" y2="552" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="224" y="168" width="128" height="24" rx="2" fill="#f5f5f5"/>
    <text x="288" y="185" text-anchor="middle" font-size="16" fill="#4f5d75">同じ音声</text>
    <rect x="784" y="168" width="192" height="24" rx="2" fill="#f5f5f5"/>
    <text x="880" y="185" text-anchor="middle" font-size="16" fill="#2e5aa8">自動文字起こし</text>
    <rect x="480" y="352" width="208" height="24" rx="2" fill="#f5f5f5"/>
    <text x="584" y="369" text-anchor="middle" font-size="16" fill="#2e5aa8">元の音声を再送</text>

    <g data-node="source">
      <rect x="48" y="328" width="240" height="112" rx="8" fill="#e8eaf0" stroke="#7a8399"/>
      <text x="168" y="371" text-anchor="middle" font-size="16" font-weight="600" fill="#2d3142">保存した元音声</text>
      <text x="168" y="399" text-anchor="middle" font-size="12" font-family="'Geist Mono', monospace" fill="#4f5d75">PCM / 48 kHz / mono</text>
      <text x="168" y="421" text-anchor="middle" font-size="12" fill="#4f5d75">2.32秒の日本語発話</text>
    </g>
    <g data-node="moonshine">
      <rect x="400" y="136" width="320" height="128" rx="8" fill="#fce9e0" stroke="#eb6c36" stroke-width="2"/>
      <text x="416" y="159" font-size="12" fill="#9a4520">今回高速化した部分</text>
      <text x="560" y="193" text-anchor="middle" font-size="16" font-weight="600" fill="#2d3142">Moonshine</text>
      <text x="560" y="222" text-anchor="middle" font-size="12" font-family="'Geist Mono', monospace" fill="#4f5d75">JA Small Streaming / Pi 4</text>
      <text x="560" y="246" text-anchor="middle" font-size="12" fill="#4f5d75">届いている音声をまとめて計算する</text>
    </g>
    <text x="416" y="292" font-size="14" font-weight="600" fill="#2d3142">特徴計算：80msずつ → 最大640ms</text>
    <text x="416" y="316" font-size="14" font-weight="600" fill="#2d3142">前処理を再利用し、待機中のCPU処理を抑える</text>

    <g data-node="soniox">
      <rect x="880" y="312" width="320" height="128" rx="8" fill="#edeef0" stroke="#9c9da5"/>
      <text x="1040" y="351" text-anchor="middle" font-size="16" font-weight="600" fill="#2d3142">Soniox</text>
      <text x="1040" y="379" text-anchor="middle" font-size="12" fill="#4f5d75">元音声＋自動結果で再認識・翻訳</text>
      <text x="1040" y="411" text-anchor="middle" font-size="12" font-family="'Geist Mono', monospace" fill="#4f5d75">stt-rt-v5 / JP region</text>
    </g>
    <g data-node="result">
      <rect x="880" y="552" width="320" height="80" rx="8" fill="#ffffff" stroke="#2d3142"/>
      <text x="1040" y="583" text-anchor="middle" font-size="16" font-weight="600" fill="#2d3142">原文と最終訳を取得</text>
      <text x="1040" y="611" text-anchor="middle" font-size="12" fill="#4f5d75">再生終了から1.99〜2.15秒 / 3回</text>
    </g>
    <text x="48" y="524" font-size="14" font-weight="600" fill="#2d3142">正解文は採点だけに使う</text>
    <text x="48" y="550" font-size="12" fill="#4f5d75">認識の入力には、音声から自動で得た結果を使う。</text>
    <text x="48" y="574" font-size="12" fill="#4f5d75">Moonshineには末尾に160msの無音を足し、元音声を全て処理する。</text>
    <text x="48" y="610" font-size="12" fill="#4f5d75">最終訳の比較は保存音声1つ。全体の精度は未検証。</text>

    <text x="48" y="634" font-size="12" fill="#4f5d75">実通話の終了待ち200msと字幕表示は測定外。</text>

    <line x1="48" y1="656" x2="1232" y2="656" stroke="#d5d7dd"/>
    <text x="48" y="688" font-size="12" fill="#4f5d75">橙の枠：高速化した処理　　青い矢印：Sonioxへの送信　　灰色の矢印：その他のデータの流れ</text>
  </svg>
  <p>同一音声による実測値と条件は、<a href="../stt-optimization/README.md">検証記録</a>にまとめています。</p>
</main>
</body>
</html>
