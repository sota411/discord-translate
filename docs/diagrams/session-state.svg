<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="session-state-title session-state-desc">
      <title id="session-state-title">翻訳セッションの状態遷移</title>
      <desc id="session-state-desc">コマンドを開始前に拒否した場合は、セッションを作らない。セッションを作成した後は、利用上限とSonioxの同時実行枠を確認し、音声接続と字幕を準備してから翻訳を始める。開始処理に失敗した場合はセッション情報を削除する。翻訳中に終了条件へ達した場合、障害が発生した場合、または停止を要求された場合は、停止処理を終えてからセッション情報を削除する。</desc>
      <defs>
        <style>@import url("https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Transitions -->
      <line x1="48" y1="180" x2="72" y2="180" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="208" y1="180" x2="248" y2="180" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="400" y1="180" x2="440" y2="180" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="592" y1="180" x2="632" y2="180" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="324" y1="220" x2="324" y2="360" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <path d="M 516 220 V 308 Q 516 316 508 316 H 368 Q 360 316 360 324 V 360" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="708" y1="220" x2="708" y2="360" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="632" y1="400" x2="400" y2="400" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <path d="M 248 400 H 188 Q 180 400 180 392 V 220" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 708 440 V 472 Q 708 480 700 480 H 112 Q 104 480 104 472 V 220" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Transition labels -->
      <rect x="48" y="160" width="24" height="12" rx="2" fill="#f5f5f5"/>
      <text x="60" y="168" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace" text-anchor="middle">起動</text>

      <rect x="208" y="160" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="228" y="168" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace" text-anchor="middle">開始要求</text>

      <rect x="400" y="160" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="420" y="168" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace" text-anchor="middle">利用を許可</text>

      <rect x="592" y="160" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="612" y="168" fill="#eb6c36" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace" text-anchor="middle">準備完了</text>

      <rect x="332" y="280" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="388" y="288" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace" text-anchor="middle">利用上限や空き枠の確認に失敗</text>

      <rect x="524" y="280" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="572" y="288" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace" text-anchor="middle">セッションの準備に失敗</text>

      <rect x="716" y="280" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="764" y="288" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace" text-anchor="middle">終了条件・障害・停止要求</text>

      <rect x="484" y="380" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="516" y="388" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace" text-anchor="middle">開始中に停止</text>

      <rect x="188" y="280" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="224" y="288" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace" text-anchor="middle">セッションを削除</text>

      <rect x="388" y="460" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="424" y="468" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace" text-anchor="middle">停止処理が完了</text>

      <!-- Start marker -->
      <circle cx="40" cy="180" r="6" fill="#2d3142"/>

      <!-- States -->
      <rect x="72" y="140" width="136" height="80" rx="8" fill="#f5f5f5"/>
      <rect x="72" y="140" width="136" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="80" y="148" width="48" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="104" y="156" fill="#2d3142" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace" text-anchor="middle">状態</text>
      <text x="140" y="184" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans JP', sans-serif" text-anchor="middle">セッションなし</text>
      <text x="140" y="204" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">ABSENT</text>

      <rect x="248" y="140" width="152" height="80" rx="8" fill="#f5f5f5"/>
      <rect x="248" y="140" width="152" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="256" y="148" width="48" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="280" y="156" fill="#2d3142" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace" text-anchor="middle">状態</text>
      <text x="324" y="180" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans JP', sans-serif" text-anchor="middle">利用上限と</text>
      <text x="324" y="196" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans JP', sans-serif" text-anchor="middle">同時実行枠を確認</text>
      <text x="324" y="212" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">AUTHORIZING</text>

      <rect x="440" y="140" width="152" height="80" rx="8" fill="#f5f5f5"/>
      <rect x="440" y="140" width="152" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="448" y="148" width="48" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="472" y="156" fill="#2d3142" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace" text-anchor="middle">状態</text>
      <text x="516" y="184" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans JP', sans-serif" text-anchor="middle">音声接続と字幕を準備</text>
      <text x="516" y="204" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">CONNECTING</text>

      <rect x="632" y="140" width="152" height="80" rx="8" fill="#f5f5f5"/>
      <rect x="632" y="140" width="152" height="80" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="640" y="148" width="48" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.52)" stroke-width="0.8"/>
      <text x="664" y="156" fill="#eb6c36" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace" text-anchor="middle">状態</text>
      <text x="708" y="184" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans JP', sans-serif" text-anchor="middle">翻訳中</text>
      <text x="708" y="204" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">ACTIVE</text>

      <rect x="248" y="360" width="152" height="80" rx="8" fill="#f5f5f5"/>
      <rect x="248" y="360" width="152" height="80" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="256" y="368" width="48" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.48)" stroke-width="0.8"/>
      <text x="280" y="376" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace" text-anchor="middle">状態</text>
      <text x="324" y="404" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans JP', sans-serif" text-anchor="middle">開始処理に失敗</text>
      <text x="324" y="424" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">FAILED</text>

      <rect x="632" y="360" width="152" height="80" rx="8" fill="#f5f5f5"/>
      <rect x="632" y="360" width="152" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="640" y="368" width="48" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="664" y="376" fill="#2d3142" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace" text-anchor="middle">状態</text>
      <text x="708" y="404" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans JP', sans-serif" text-anchor="middle">停止処理中</text>
      <text x="708" y="424" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">STOPPING</text>

      <text x="480" y="512" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace" text-anchor="middle">セッションがある状態で停止を要求すると停止処理へ進む。開始中なら、その後に開始失敗へ進む。</text>

      <!-- Legend strip -->
      <line x1="40" y1="536" x2="920" y2="536" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="560" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace">凡例</text>
      <rect x="144" y="548" width="20" height="12" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>
      <text x="176" y="560" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace">通常の状態</text>
      <rect x="304" y="548" width="20" height="12" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="0.8"/>
      <text x="336" y="560" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace">利用料金が発生する状態</text>
      <line x1="520" y1="554" x2="568" y2="554" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="584" y="560" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace">開始に失敗した経路</text>
    </svg>
