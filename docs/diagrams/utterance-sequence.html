<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1発話を翻訳音声と字幕へ変換する流れ</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --color-accent: #eb6c36;
      --font-sans: 'Geist', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif JP', serif;
      --font-mono: 'Geist Mono', 'Noto Sans Mono CJK JP', monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { width: 100%; max-width: 1280px; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Diagram Design</p>
    <h1>1発話を翻訳音声と字幕へ変換する流れ</h1>

    <svg viewBox="0 0 1280 840" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="utterance-sequence-title utterance-sequence-desc">
      <title id="utterance-sequence-title">1発話を翻訳音声と字幕へ変換する流れ</title>
      <desc id="utterance-sequence-desc">Discordの発話をSonioxへ送り、endpoint後に字幕投稿とTTSを並行開始する。TTS接続は後続発話で再利用し、再生中は次の1件だけを先読みして、Discordへの再生順はFIFOに保つ。</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Lifelines -->
      <line x1="120" y1="128" x2="120" y2="760" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="360" y1="128" x2="360" y2="760" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="620" y1="128" x2="620" y2="760" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="880" y1="128" x2="880" y2="760" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="1140" y1="128" x2="1140" y2="760" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- ALT fragment: provisional versus final tokens -->
      <rect x="320" y="256" width="340" height="176" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <rect x="320" y="256" width="40" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="340" y="268" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>
      <text x="332" y="288" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace" letter-spacing="0.04em">[is_final = false]</text>
      <line x1="328" y1="352" x2="652" y2="352" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="332" y="376" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace" letter-spacing="0.04em">[is_final = true · endpoint]</text>

      <!-- PAR fragment: caption post and TTS request begin together -->
      <rect x="320" y="440" width="840" height="104" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <rect x="320" y="440" width="40" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="340" y="452" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">PAR</text>
      <line x1="328" y1="484" x2="1152" y2="484" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>

      <!-- Activation bars stay behind arrows and labels -->
      <rect x="356" y="168" width="8" height="592" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="616" y="216" width="8" height="216" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="876" y="496" width="8" height="184" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="1136" y="456" width="8" height="304" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- Messages -->
      <line x1="120" y1="176" x2="356" y2="176" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="364" y1="224" x2="616" y2="224" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="616" y1="328" x2="364" y2="328" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <line x1="616" y1="416" x2="364" y2="416" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="364" y1="464" x2="1136" y2="464" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <line x1="364" y1="504" x2="876" y2="504" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="876" y1="544" x2="364" y2="544" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <line x1="364" y1="584" x2="1136" y2="584" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <line x1="1136" y1="624" x2="124" y2="624" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <line x1="876" y1="664" x2="364" y2="664" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="1136" y1="704" x2="364" y2="704" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <line x1="364" y1="744" x2="1136" y2="744" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>

      <!-- One-ahead prefetch note; playback order remains FIFO -->
      <rect x="730" y="674" width="300" height="20" rx="4" fill="rgba(235,108,54,0.08)" stroke="rgba(235,108,54,0.45)" stroke-width="1"/>
      <text x="880" y="687" fill="#2d3142" font-size="8" font-family="'Geist Mono', 'Noto Sans Mono CJK JP', monospace" text-anchor="middle">前の再生中 · 次の1件だけTTS生成してPCM保持</text>

      <!-- Message labels: every mask stays clear of its connector -->
      <rect x="176" y="152" width="128" height="12" rx="2" fill="#f5f5f5"/>
      <text x="240" y="160" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OPUS AUDIO</text>

      <rect x="436" y="200" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="488" y="208" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PCM CHUNKS</text>

      <rect x="420" y="304" width="140" height="12" rx="2" fill="#f5f5f5"/>
      <text x="490" y="312" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PROVISIONAL TOKENS</text>

      <rect x="408" y="392" width="164" height="12" rx="2" fill="#f5f5f5"/>
      <text x="490" y="400" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FINAL TOKENS + ENDPOINT</text>

      <rect x="688" y="440" width="124" height="12" rx="2" fill="#f5f5f5"/>
      <text x="750" y="448" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CAPTION: PENDING</text>

      <rect x="548" y="480" width="144" height="12" rx="2" fill="#f5f5f5"/>
      <text x="620" y="488" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CONFIG + TEXT_END</text>

      <rect x="568" y="520" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="620" y="528" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PCM AUDIO</text>

      <rect x="684" y="560" width="132" height="12" rx="2" fill="#f5f5f5"/>
      <text x="750" y="568" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RAW PCM PLAYBACK</text>

      <rect x="558" y="600" width="144" height="12" rx="2" fill="#f5f5f5"/>
      <text x="630" y="608" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TRANSLATED VOICE</text>

      <rect x="532" y="640" width="176" height="12" rx="2" fill="#f5f5f5"/>
      <text x="620" y="648" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AUDIO_END → TERMINATED</text>

      <rect x="480" y="680" width="148" height="12" rx="2" fill="#f5f5f5"/>
      <text x="554" y="688" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PLAYBACK COMPLETE</text>

      <rect x="674" y="720" width="152" height="12" rx="2" fill="#f5f5f5"/>
      <text x="750" y="728" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CAPTION STATUS EDIT</text>

      <!-- Actors -->
      <rect x="40" y="64" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="64" width="160" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="120" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans JP', sans-serif" text-anchor="middle">発話者</text>
      <text x="120" y="112" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Discord VC</text>

      <rect x="280" y="64" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="280" y="64" width="160" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="360" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans JP', sans-serif" text-anchor="middle">Botパイプライン</text>
      <text x="360" y="112" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">endpoint · one-ahead FIFO</text>

      <rect x="540" y="64" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="540" y="64" width="160" height="64" rx="6" fill="rgba(46,90,168,0.04)" stroke="#2e5aa8" stroke-width="1"/>
      <text x="620" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans JP', sans-serif" text-anchor="middle">Soniox STT</text>
      <text x="620" y="112" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">two_way translation</text>

      <rect x="800" y="64" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="800" y="64" width="160" height="64" rx="6" fill="rgba(46,90,168,0.04)" stroke="#2e5aa8" stroke-width="1"/>
      <text x="880" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans JP', sans-serif" text-anchor="middle">Soniox TTS</text>
      <text x="880" y="112" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">lazy persistent WebSocket</text>

      <rect x="1060" y="64" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="1060" y="64" width="160" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="1140" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans JP', sans-serif" text-anchor="middle">Discord出力</text>
      <text x="1140" y="112" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">voice + text</text>

      <!-- Legend strip -->
      <line x1="40" y1="780" x2="1240" y2="780" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="808" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <line x1="148" y1="802" x2="196" y2="802" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="212" y="808" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Call</text>
      <line x1="300" y1="802" x2="348" y2="802" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="364" y="808" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Return</text>
      <line x1="468" y1="802" x2="516" y2="802" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <text x="532" y="808" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Async output</text>
      <line x1="680" y1="802" x2="728" y2="802" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="744" y="808" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Stable / terminal event</text>
    </svg>
  </div>
</body>
</html>
