name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.17.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
      - run: pnpm check
      - run: pnpm build
      - run: pnpm smoke:runtime
      - run: pnpm diagrams:sync && git diff --exit-code -- docs/diagrams
      - run: cp .env.example .env.local && docker compose --env-file .env.local config -q
      - run: docker build --tag discord-translate:ci .
